<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>

  <title>Document</title>
</head>

<body>
  <h1 id="titulo">Evento Tecnológico</h1>

  <p id="local">Local por definir</p>

  <p id="mensagem">Consulta as novidades do evento.</p>


  <section class="container">
    <section class="card" style="max-width: 320px">
      <img
        src="https://web-summit-engine.imgix.net/i17039h4zcczhy5mqmalxzucqtuz?ixlib=rails-4.3.1;auto=format;fit=crop;crop=faces;"
        class="card-img-top" alt="...">
      <div class="card-body">
        <p id="titulo_1">Nome</p>
        <p id="texto">Cargo</p>
        <a id="atualizar" href="#" class="btn-solid theme-primary">Atualizar informação</a>
      </div>
    </section>
  </section>

  <script>
    const evento = {
      nome: "Web Summit 2026",
      cidade: "Lisboa, Portugal",
      mensagem: "Bem-vindo ao futuro da tecnologia!",
      nome_1: "Li Chen",
      oq_faz: "Chen Li é cofundador da Unitree, empresa que representa o boom da robótica na China.Ele liderou a comercialização da empresa desde o início, lançando seu primeiro cão- robô no mercado e construindo um negócio que agora alcança mais da metade dos países e regiões do mundo.",
      
    };

    const botao = document.querySelector("#atualizar");

    botao.addEventListener("click", () => {
      document.querySelector("#titulo").textContent =
        evento.nome;

      document.querySelector("#local").textContent =
        evento.cidade;

      document.querySelector("#mensagem").textContent =
        evento.mensagem;
        document.querySelector("#titulo_1").textContent =
        evento.nome_1;

        document.querySelector("#texto").textContent =
        evento.oq_faz;                                                                                      
    });

  </script>

</body>

</html>
